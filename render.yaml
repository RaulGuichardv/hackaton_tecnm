services:
  - type: web
    name: credetec-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Base de datos MariaDB Cloud (configurar manualmente en Render)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4003"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: credetec

      # Autenticación administrativa
      - key: CREDETEC_SECRET_KEY
        sync: false
      - key: CREDETEC_TOKEN_TTL
        value: "43200"

      # URL del frontend para enlaces de verificación QR
      - key: PUBLIC_BASE_URL
        sync: false

      # Notificaciones por HTTPS (obligatorio en Render Free).
      # Render Free bloquea los puertos SMTP 25, 465 y 587 desde septiembre de 2025.
      # Configura al menos una de estas claves y verifica el remitente en el proveedor.
      - key: BREVO_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_API_FROM
        sync: false

      # Notificaciones SMTP (solo funciona en local o en planes pagados de Render)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_SSL
        value: "false"
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_TIMEOUT
        value: "10"
